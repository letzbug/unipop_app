<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniPop Go · Accès</title><link rel="stylesheet" href="access.css?v=41"></head><body>
<main class="shell"><header><div><span>UNIPOP GO</span><h1>Gestion des accès</h1><p>Formateurs, activation, blocage et réinitialisation.</p></div><div class="head-actions"><a href="index.html">UniPop Go</a><button id="logout">Déconnexion</button></div></header>
<section id="gate" class="panel"><h2>Connexion administrateur</h2><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Mot de passe"><button id="login">Se connecter</button><p id="gateStatus"></p></section>
<div id="app" class="hidden"><section class="panel"><h2>Autoriser un formateur</h2><div class="grid"><input id="trainer" list="names" placeholder="Nom du formateur"><datalist id="names"></datalist><input id="trainerEmail" type="email" placeholder="E-mail"><select id="role"><option value="trainer">Formateur</option><option value="admin">Administrateur</option></select><button id="create">Créer / réactiver</button></div><p id="createStatus"></p></section>
<section class="panel"><div class="bar"><div><h2>Accès</h2><small id="count"></small></div><input id="search" type="search" placeholder="Rechercher nom ou e-mail"></div><div id="list"></div></section></div></main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="access.js?v=41"></script></body></html>
