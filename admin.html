<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06111f">
  <title>UniPop Go Admin</title>
  <link rel="stylesheet" href="admin.css?v=34">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-head">
      <div>
        <span class="eyebrow">UniPop Go</span>
        <h1>Administration des accès</h1>
        <p>Autoriser, bloquer ou supprimer l’accès des formateurs.</p>
      </div>
      <button id="adminLogout" class="ghost hidden">Se déconnecter</button>
    </header>

    <section id="adminLogin" class="panel login-panel">
      <h2>Connexion administrateur</h2>
      <label>E-mail<input id="adminEmail" type="email" autocomplete="email"></label>
      <label>Mot de passe<input id="adminPassword" type="password" autocomplete="current-password"></label>
      <button id="adminLoginButton" class="primary">Se connecter</button>
      <p id="adminLoginStatus" class="status"></p>
    </section>

    <section id="adminApp" class="hidden">
      <div class="toolbar">
        <div>
          <small>Administrateur</small>
          <strong id="adminIdentity"></strong>
        </div>
        <button id="refreshUsers" class="ghost">↻ Actualiser</button>
      </div>

      <section class="panel">
        <h2>Ajouter un formateur</h2>
        <div class="form-grid">
          <label>Formateur
            <input id="trainerName" list="trainerNames" placeholder="Nom du formateur">
            <datalist id="trainerNames"></datalist>
          </label>
          <label>E-mail
            <input id="trainerEmail" type="email" placeholder="prenom.nom@...">
          </label>
          <label>Rôle
            <select id="trainerRole">
              <option value="trainer">Formateur</option>
              <option value="admin">Administrateur</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <button id="addTrainer" class="primary">Autoriser l’accès</button>
        </div>
        <p class="hint">Le formateur utilise ensuite « Première connexion » dans UniPop Go et choisit lui-même son mot de passe.</p>
        <p id="addStatus" class="status"></p>
      </section>

      <section class="panel">
        <div class="list-head">
          <div>
            <h2>Accès formateurs</h2>
            <span id="userCount"></span>
          </div>
          <input id="userSearch" class="user-search" type="search" placeholder="Rechercher un formateur ou e-mail">
        </div>
        <div id="usersList" class="users-list"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js?v=34"></script>
</body>
</html>
